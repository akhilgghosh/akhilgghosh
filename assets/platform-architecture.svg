<rect width="1200" height="320" rx="16" fill="#0d1117"/>
<text x="26" y="37" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Web platform &amp; desktop agent</text>
<text x="26" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="16">Desktop components and a web interface share an application backend.</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#f0f6fc" text-anchor="middle">
<rect x="26" y="96" width="300" height="82" rx="12" fill="#161b22" stroke="#58a6ff"/><text x="176" y="145">Rust desktop agent</text>

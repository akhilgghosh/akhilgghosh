<text x="748" y="123" fill="#e3a332" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">04</text>
<text x="836" y="155" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">Dimensions</text>
<text x="836" y="179" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">and annotations</text>
<path d="M943 152 H962" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

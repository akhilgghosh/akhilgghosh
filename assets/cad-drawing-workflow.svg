<text x="128" y="167" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">CAD model</text>
<path d="M235 152 H254" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="262" y="96" width="204" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="262" y="96" width="204" height="4" rx="2" fill="#e3a332"/>
<text x="276" y="123" fill="#e3a332" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">02</text>
<text x="364" y="155" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">Drawing</text>
<text x="364" y="179" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">views</text>
<path d="M471 152 H490" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="498" y="96" width="204" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="498" y="96" width="204" height="4" rx="2" fill="#e3a332"/>
<text x="512" y="123" fill="#e3a332" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">03</text>
<text x="600" y="155" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">Scale</text>
<text x="600" y="179" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">and layout</text>
<path d="M707 152 H726" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="96" width="204" height="112" rx="12" fill="#161b22" stroke="#30363d"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">CAD drawing workflow</title><desc id="desc">CAD model → Drawing views → Scale and layout → Dimensions and annotations → PDF export</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b949e"/></marker></defs>
<rect width="1200" height="240" rx="16" fill="#0d1117"/>
<text x="26" y="37" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">CAD drawing workflow</text>
<text x="26" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="16">From a CAD model to drawing preparation and export.</text>
<rect x="26" y="96" width="204" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="26" y="96" width="204" height="4" rx="2" fill="#e3a332"/>
